<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>04 · Fortelling i boardet</title>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/_shared/baseline.css" />
  <style>
    /* ============================================================
       SPØRSMÅLET PROTOTYPEN TESTER:
       Kartet med 464 punkter sier «her er det mye» — det er dekningen
       megleren betaler for. Men den som ikke selv zoomer og trykker,
       får ingenting ut av den. Kan meglerens utvalg presenteres som en
       guidet rekkefølge INNE i boardet — uten lyd, uten bilder, og
       uten at ett eneste kartpunkt må trykkes?

       Fortellingen bor i sheeten vi alt har (01s feil var kart i full
       høyde under en scrollende body — scrollen og kartet slåss).
       Ett stopp = én kategori, og innholdet finnes allerede:
         spørsmålet   = cat.question   («Er det bra for barna?»)
         prosaen      = cat.lead
         stedene      = editorial.highlights — «Verdt å merke seg», 3 stk
       Ingen ny kurering. Fortellingen er en ny REKKEFØLGE på det vi har.

       Stoppet har tre faner fordi svaret har tre former og ikke får plass
       samtidig: ord, steder, spørsmål og svar. Spørsmålet står OVER fanene —
       stoppet ER spørsmålet, fanene er de tre måtene det besvares.
       Sheeten har fast høyde: fanene scroller inni, flaten står stille.

       To inngangar, vekslet øverst til venstre:
         Tett       = dagens board først, fortellingen bak en play-knapp
         Fortelling = fortellingen møter deg, boardet ligger bak «Avslutt»

       Og en utvalgs-veksler ved siden av, fordi omvisningen ikke koster noe å
       produsere — den kjører på data hvert board alt har. Skillet mellom en
       åpen løsning og en ferdig kuratert kan derfor ikke være OM du får
       omvisningen, bare HVEM som plukket de tre stedene:
         Megler  = «Verdt å merke seg», et menneskes utvalg (Moat 1)
         Nærmest = de tre nærmeste målte, det maskinen klarer alene
       Samme board, samme UI. Er forskjellen stor nok å ta penger for?

       Og det ene grepet som gjør modusen enklere, ikke bare pyntere:
       pinnene er illustrasjon. Trykkflaten er stedene i sheeten.
       ============================================================ */

    /* ---------- Fortellingsflaten ---------- */
    /* Ikke et kort. Baselinens `.m-card` er ett av mange kort i en liste — her
       er stoppet det ENESTE innholdet i sheeten, og da er rammen rundt bare en
       strek som gjentar sheetens egen kant. Uten den blir flaten hvit og rolig,
       og de 14 pikslene kortet holdt av på hver side blir pusterom i stedet.
       `flex: none` fordi desktop-sidekolonnens `.scroll` er en flex-kolonne —
       uten den krympes flaten og siste linje klippes. */
    .sty { flex: none; margin-bottom: 10px; }
    /* Presentasjonsmodus har hvit sheet: fortellingen er forgrunnen, ikke et
       kort som ligger på en beige flate. Dekket arver samme hvite — men bare på
       mobil: desktop-dekket hører til sidekolonnen og skal ha dens farge. */
    body[data-story="on"] .sheet { background: #fff; }
    /* Handlen mister sin egen farge i omvisningen. Den beige stripen over det
       hvite kortet leste som en list på toppen av flaten, ikke som kanten av
       den. Hvit — IKKE gjennomsiktig: handlen er sticky, og innholdet går
       under den, så en gjennomsiktig strek ville vist teksten sladre forbi. */
    body[data-story="on"] .grab { background: #fff; }
    /* Streken var affordansen den gang sheeten hadde én bevegelse å avsløre.
       Nå er flaten fri: et drag stopper der utrullingen dør, og handlen har i
       tillegg tre utgangspunkter på trykk. Streken beskriver dermed noe du
       allerede har sett flaten gjøre. `visibility` og ikke `display`: plassen
       blir stående, så draget beholder treffflaten sin. */
    body[data-story="on"] .grab .bar { visibility: hidden; }
    /* De 6 px under handlen var luft rundt en strek som ikke lenger vises.
       Spørsmålet og krysset rykker opp like mye, og alt under dem følger med —
       det er sheetens overkant som strammes, ikke én rad som flyttes.
       `--grab-h` måles av `sizeMobileSurface`, så krysset som fester seg rett
       under handlen finner den nye høyden selv. */
    body[data-story="on"] .grab { padding-bottom: 0; }
    /* Spørsmålet ER overskriften — og det er nå det FØRSTE i sheeten. Telleren,
       «1 av 6» og «Avslutt» sto over det og gjorde spørsmålet til andrelinje i
       sitt eget stopp; de hører til transporten og har flyttet ned i dekket.
       Det er kjøperens spørsmål — vår kategorilabel («Barn & oppvekst») er
       arkivarens ord, ikke hennes. */
    /* Overskriften sto en stund UTEN denne regelen: en avstumpet kopi av
       kommentar-linja over lå igjen etter at kommentaren var lukket, og
       CSS-parseren spiste regelen mens den lette etter noe den kjente igjen.
       Spørsmålet rendret da som en helt vanlig h3 — 18,72 px,
       `line-height: normal`, null padding — og det lignet nok til at ingen så
       det. Symptomet var at krysset ikke lot seg innrette: det målte mot en
       overskrift som ikke hadde målene den skulle ha.

       Skriv ALDRI en avsluttende kommentar-sekvens inni en CSS-kommentar, ikke
       engang i backticks — den lukker kommentaren der og da, og neste regel
       forsvinner på nøyaktig samme måte. */
    /* Spørsmålet ER den fastlimte headeren. Da omvisningskortet var lite,
       kunne sheeten aldri nå taket, og den fastlimte tilstanden var ikke
       nåbar. Med alle stedsradene ekspandert går innholdet forbi taket — og
       da scrollet spørsmålet bort bak kartet mens krysset ble stående festet
       rett under en TOM handle (`sheetTitle()` er "" i omvisningen), oppå
       innholdet som passerte. Rapportert av Andreas 2026-08-25.

       Sticky slår først inn når raden ville forlatt flaten, så hvilestillingen
       er uendret. Bakgrunnen går i full bredde — uten `margin: 0 -16px` ville
       fanene skint gjennom i de 16 px sheet-padding på hver side når de gikk
       under. De 10 px som lå som `margin-top` på faneraden er flyttet hit som
       `padding-bottom`: samme luft, men nå dekket av den hvite stripen i
       stedet for gjennomsiktig.

       Desktop settes tilbake til vanlig flyt: der finnes ingen handle å feste
       seg under, og sidekolonnen har 24 px padding, ikke 16. */
    .sty-q {
      position: sticky; top: var(--grab-h, 22px); z-index: 2;
      margin: 0 -16px; padding: 4px 56px 10px 16px;
      background: #fff;
      font-size: 19px; font-weight: 700;
      line-height: 1.2; letter-spacing: -.02em; color: var(--stone-900);
    }
    @media (min-width: 1024px) {
      .sty-q { position: static; margin: 0; padding: 4px 40px 0 0; }
      .sty-tabs { margin-top: 10px; }
    }
    .sty-lead { font-size: 14px; line-height: 1.55; color: var(--stone-600); }
    .sty-eb { margin: 0 0 6px; }

    /* Segmentert kontroll: tre svar på samme spørsmål — i ord, i steder, i
       spørsmål og svar. Den valgte brikken løftes med hvitt og skygge; det er
       den bevegelsen som viser at trykket på et av snarveis-kortene i
       «Om området» faktisk gjorde noe. */
    .sty-tabs {
      display: flex; gap: 2px; margin: 0; padding: 3px;
      border-radius: 999px; background: rgba(0,0,0,.045);
    }
    .sty-tabs button {
      min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border-radius: 999px; padding: 9px 6px;
      font-size: 12px; font-weight: 600; color: var(--stone-500);
      transition: background-color 180ms ease, color 180ms ease;
    }
    .sty-tabs button[aria-selected="true"] {
      background: #fff; color: var(--stone-900); box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    /* Fanene bytter enkelt: den inaktive tas ut av layouten. Sheeten har fast
       høyde gjennom hele omvisningen (se `sizeStory`), så en fane som er høyere
       enn en annen gir bare mer å scrolle — ikke en flate som flytter seg.
       Grid-stablingen som holdt fanene like høye er borte med den: den fantes
       bare for å hindre at sheeten hoppet, og nå hopper den ikke uansett. */
    .sty-pane { padding-top: 12px; }
    .sty-pane[data-active="false"] { display: none; }

    /* Snarveiene ut av prosaen: to like kort side om side, ett per fane som
       ikke er ord. Ett kort på full bredde leste som «det finnes ÉN ting mer
       her»; to halve sier at svaret har tre former og at du velger. Brikkene
       er `hl-icons` fra produksjonen. */
    .sty-dual {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 12px 0 4px;
    }
    .sty-dual.one { grid-template-columns: 1fr; } /* kategorien har ingen svar */
    /* Disse ER kort, på hvit flate: en svak grå bunn i stedet for hvitt-på-hvitt. */
    .sty-mini {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      border-radius: 14px; background: rgba(0,0,0,.035);
      padding: 10px; text-align: left; transition: background-color 150ms;
    }
    .sty-mini:hover { background: rgba(0,0,0,.06); }
    .sty-mini .t {
      display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3;
      color: var(--stone-800);
    }
    .sty-mini .b { display: flex; width: 100%; align-items: center; gap: 6px; }
    .sty-mini .s { min-width: 0; flex: 1; font-size: 11.5px; color: var(--stone-500); }
    .sty-mini .b > svg { flex: none; color: var(--stone-400); }
    /* Ringen mellom de overlappende brikkene må matche flaten de ligger på. */
    .sty-mini .hl-icons > span { box-shadow: 0 0 0 2px #fff; }

    .sty-list { padding: 0 0 8px; }
    .sty-row {
      display: flex; width: 100%; align-items: center; gap: 9px;
      border-radius: 12px; padding: 9px 4px; text-align: left;
    }
    .sty-row:hover { background: rgba(0,0,0,.03); }
    .sty-row[aria-current="true"] { background: rgba(0,0,0,.04); }
    /* Chevron-plassen holdes av også når stedet mangler tekst, ellers står
       «17 min» lenger til høyre enn «4 min» rett over. */
    .sty-row .chev-gap { width: 15px; flex: none; }
    .sty-row .dot { height: 8px; width: 8px; flex: none; border-radius: 999px; }
    .sty-row .n {
      min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; color: var(--stone-900);
    }
    .sty-row .m { flex: none; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--stone-500); }
    /* Stedets tekst åpner seg der raden står. Ingen modal, ingen ny flate —
       det er hele poenget med modusen. Begge tilstander i DOM, ingen auto-scroll.
       Samme kurve og varighet som sheeten (se `body[data-story="on"] .sheet`):
       teksten og flaten den ligger i skal være ÉN bevegelse, ikke to. 300 ms
       ease-out var raskere enn sheeten og leste som et rykk. */
    .sty-narr { overflow: hidden; max-height: 0; opacity: 0;
      transition: max-height 420ms cubic-bezier(.32,.72,0,1), opacity 300ms ease-out; }
    .sty-narr[data-expanded="true"] { max-height: 600px; opacity: 1; }
    .sty-narr p { padding: 0 4px 10px 21px; font-size: 13px; line-height: 1.6; color: var(--stone-600); }

    /* Andre gruppe i steds-fanen: kategoriens nærmeste utover de utvalgte.
       Uten dem er fanen tre rader og føles som en rest av prosaen; med dem er
       den en liste. */
    .sty-more { margin: 10px 0 6px; }

    /* Fane 3: kategoriens spørsmål og svar. `faq-item`-idiomet er produksjonens,
       men svaret åpnes gjennom vår egen ruting (`tapFaq`) — baselinens toggle
       ville stått igjen med tilstanden vår ute av sync. Samme kurve som
       stedsteksten, og grå bunn fordi flaten under er hvit. */
    .sty-faq { padding: 0 0 8px; }
    .sty-faq .faq-item { border-color: transparent; background: rgba(0,0,0,.035); }
    .sty-faq .faq-item:hover { border-color: transparent; background: rgba(0,0,0,.06); }
    .sty-faq .faq-a { transition: max-height 420ms cubic-bezier(.32,.72,0,1), opacity 300ms ease-out; }

    /* ---------- Dekket: transporten, festet UTENFOR sheeten ---------- */
    /* Lå «Videre» nederst i sheeten, ville den flyttet seg hver gang innholdet
       over den endret seg. Nå ligger den i et fast dekk i rammens underkant:
       innholdet scroller, knappen som alltid gjelder står stille.

       Høyden publiseres som `--sty-deck-h` slik at sheeten kan padde for
       dekket i stedet for å legge siste rad under det. */
    /* Dekket er ikke lenger en flate, bare et feste: baren flyter over
       innholdet, og det som scroller under den blir liggende der — uskarpt,
       men synlig. En heldekkende hvit stripe kuttet sheeten i to og lot som
       om innholdet sluttet der. */
    .sty-deck {
      position: fixed; z-index: 35; left: 0; right: 0; bottom: 0;
      padding-bottom: env(safe-area-inset-bottom);
      pointer-events: none;
    }
    .sty-deck > * { position: relative; z-index: 1; pointer-events: auto; }
    /* Slør bak hele festet, ikke bare bak baren. Uten det sto skarp brødtekst
       i springene rundt baren — over den, og i stripen ned mot skjermkanten —
       og konkurrerte med kategorinavnene på 11 px. Masken toner sløret inn
       ovenfra, så det ikke oppstår en synlig kant der uskarpheten begynner. */
    .sty-deck::before {
      content: ""; position: absolute; z-index: 0; left: 0; right: 0; top: -26px; bottom: 0;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.55) 60%);
      mask-image: linear-gradient(to bottom, transparent, #000 30px);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30px);
      pointer-events: none;
    }
    .sty-deck[hidden] { display: none; }
    /* Desktop: dekket hører til sidekolonnen, ikke kartet. */
    @media (min-width: 1024px) {
      .sty-deck { right: auto; width: var(--sidebar-w); }
    }
    body[data-story="on"] .sheet-body,
    body[data-story="on"] .scroll { padding-bottom: var(--sty-deck-h, 96px); }

    /* ---------- Transporten: kategorinavnene som en tab-rad i dekket ----------
       Seks anonyme streker fortalte HVOR MANGE, ikke HVA. Med navnene i
       radenopper begge deler samtidig: du ser hvor du er, hva du har vært
       gjennom, og — viktigst — hva som kommer, uten at noe annet må si det.

       Raden forskyver seg i takt med fortellingen: det aktive stoppet legger
       seg mot venstre kant med en flik av det forrige synlig bak seg, og det
       som kommer ligger til høyre. Det er progresjonen, uttrykt som bevegelse
       i stedet for som et tall.

       Raden ligger i det faste dekket, ikke i sheeten: transporten skal stå
       stille mens innholdet scroller — og den skal være der tommelen er.

       Den scroller fritt i tillegg til å følge fortellingen: en kategori langt
       til høyre skal kunne nås uten å gå gjennom alle stoppene foran den.
       Scrollbaren skjules — raden er 6 navn, ikke et dokument.

       At dekket ligger UTENFOR `#app` er det som gjør fri scroll mulig:
       `#app` bygges på nytt ved hver render (kartet rendrer på hver `moveend`),
       og en scroll-posisjon overlever ikke det. Dekket rendres bare av
       `paintDeck`, og der oppdateres radens tilstand i stedet for å bygges på
       nytt — nettopp for at posisjonen din skal stå. */
    .sty-hop { position: relative; display: flex; align-items: stretch; padding: 6px 14px 8px; }
    /* Sporet ER navbaren: én sammenhengende avrundet flate med faste ender,
       og innholdet ruller inni den. Rullet baren selv, ville endene forsvunnet
       ut av syne og flaten sluttet å lese som én ting. */
    .sty-hoptrack {
      position: relative; min-width: 0; flex: 1;
      border-radius: 22px;
      background: rgba(252,251,250,.72);
      backdrop-filter: blur(12px) saturate(1.7);
      -webkit-backdrop-filter: blur(12px) saturate(1.7);
      box-shadow: inset 0 0 0 1px rgba(28,25,23,.07), 0 6px 22px rgba(28,25,23,.13);
      overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
      scroll-behavior: smooth; overscroll-behavior-x: contain;
    }
    .sty-hoptrack::-webkit-scrollbar { display: none; }
    /* Toninger i barens egne kanter: en brikke klippet midt i et ord leser som
       en feil i stedet for som «det ligger mer den veien». De ligger på dekket,
       ikke i sporet — et element som ruller med, toner ingenting. */
    .sty-hop::before, .sty-hop::after {
      content: ""; position: absolute; z-index: 1; top: 6px; bottom: 8px; width: 20px;
      pointer-events: none;
    }
    .sty-hop::before {
      left: 14px; border-radius: 22px 0 0 22px;
      background: linear-gradient(to right, rgba(252,251,250,.92), rgba(252,251,250,0));
    }
    .sty-hop::after {
      right: 14px; border-radius: 0 22px 22px 0;
      background: linear-gradient(to left, rgba(252,251,250,.92), rgba(252,251,250,0));
    }
    .sty-hoprail { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 2px; padding: 4px; }
    /* Ikonet står OVER navnet, sentrert: det er det som gjør de seks til én
       navbar og ikke seks løse brikker. Ikonet er lite — det skal kjennes
       igjen, ikke leses. */
    .sty-hoprail button {
      display: flex; flex: none; flex-direction: column; align-items: center; gap: 3px;
      border-radius: 18px; padding: 6px 11px 7px;
      font-size: 11px; font-weight: 600; letter-spacing: -.01em;
      color: var(--stone-500); white-space: nowrap;
      transition: background-color 240ms ease, color 240ms ease;
    }
    .sty-hoprail .ic {
      display: flex; height: 20px; width: 20px; flex: none;
      align-items: center; justify-content: center;
      border-radius: 999px; background: var(--c, var(--stone-500)); color: #fff;
    }
    /* Ikonene står i full farge uansett tilstand. Å dempe dem gjorde
       progresjonen lesbar og kategoriene uleselige — og raden er først og
       fremst et sted du skal finne fram i.

       Progresjonen ligger derfor bare i teksten: der er forskjellen nok til å
       merkes og for liten til å skjule noe.

       Blobben er nøytral, ikke kategorifarget: fargen bor allerede i ikonet
       rett over, og to flater i samme farge oppå hverandre gjorde bare den ene
       vanskeligere å lese. Hvit på den grå baren, med en hårfin ring — det er
       nok til å si «her står du». */
    .sty-hoprail button[data-state="past"] { color: var(--stone-600); }
    .sty-hoprail button[aria-current="true"] {
      background: #fff; color: var(--stone-900);
      box-shadow: inset 0 0 0 1px rgba(28,25,23,.07), 0 1px 3px rgba(28,25,23,.1);
    }

    /* ---------- Reisemåte: enheten over minutt-kolonnen ----------
       Lå velgeren i navbaren, hadde den samme form som de seks stoppene —
       ikon over navn, samme blob — men gjorde noe helt annet: den flytter deg
       ikke, den endrer betydningen av tall lenger opp. En tab-bar der én av
       brikkene er en innstilling lover et syvende stopp.

       Her står den i stedet der tallene står, høyrestilt rett over
       «N min»-kolonnen. Da leser den som en ENHET — «disse tidene er i
       gange» — og ikke som en destinasjon. Den forsvinner av seg selv i Om
       området og Spørsmål, der det ikke finnes tider å forklare, og kart-pillen
       kan bli stående: de to er ikke lenger to versjoner av samme knapp. */
    .sty-ebrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sty-ebrow .eyebrow { min-width: 0; }
    .sty-mode { position: relative; flex: none; }
    .sty-mode > button {
      display: flex; align-items: center; gap: 3px;
      /* 22 px = radens chevron-kolonne (15) + gap (9) + radens padding (4)
         minus knappens egen padding (6). Da lander «Gange» nøyaktig over
         «3 min» og ikke over chevronen — det er den loddrette linja som gjør
         at den leser som en kolonneoverskrift og ikke som en løs knapp. */
      margin-right: 22px; border-radius: 8px; padding: 3px 6px;
      font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
      color: var(--stone-500); white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .sty-mode > button:hover { background: rgba(28,25,23,.05); color: var(--stone-900); }
    .sty-mode > button[aria-expanded="true"] { background: rgba(28,25,23,.06); color: var(--stone-900); }
    .sty-mode > button .ic { display: flex; flex: none; }
    .sty-mode .chev { display: flex; color: var(--stone-400); transition: transform 200ms ease; }
    .sty-mode > button[aria-expanded="true"] .chev { transform: rotate(180deg); }

    /* Panelet folder NEDOVER: overskriften står øverst i fanen, og over den er
       det bare faneraden. `BoardPathMidpointMarker` måler retningen ved åpning
       fordi chipen der kan ligge hvor som helst i viewporten — her kan den ikke.

       Formen er panel-varianten fra `TravelModeSelector`: alle modusene med
       tiden sin, så du ser hva du bytter TIL før du bytter. Tallene er
       precomputet (`POI.travelTime`), så panelet har ingen lastetilstand. */
    .sty-modepop {
      position: absolute; top: 100%; right: 0; z-index: 6;
      margin-top: 6px; width: 194px; padding: 6px;
      border-radius: 14px; border: 1px solid var(--stone-200);
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 14px 34px rgba(28,25,23,.2);
    }
    .sty-modepop[hidden] { display: none; }
    .sty-modepop button {
      display: flex; width: 100%; align-items: center; gap: 10px;
      border-radius: 9px; padding: 8px 10px;
      font-size: 13.5px; font-weight: 400; letter-spacing: 0;
      color: var(--stone-600); text-align: left;
    }
    .sty-modepop button[aria-pressed="true"] {
      background: var(--stone-100); color: var(--stone-900); font-weight: 600;
    }
    .sty-modepop .ic { display: flex; flex: none; color: inherit; }
    .sty-modepop .nm { min-width: 0; flex: 1; }
    .sty-modepop .mn { flex: none; font-size: 13px; font-variant-numeric: tabular-nums; }
    .sty-modepop .foot {
      margin-top: 4px; border-top: 1px solid rgba(28,25,23,.06); padding: 7px 10px 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: var(--stone-400);
    }
    /* Utgangen hører til flaten du forlater, ikke til transporten: den ligger
       øverst til høyre i sheeten, der en lukkeknapp alltid har ligget.
       Beholderen er null piksler høy og sticky — krysset blir stående mens
       innholdet scroller under det, uten å skyve spørsmålet nedover.
       Festet UNDER handlen, ikke i toppen: scrolleren er `.sheet-outer`, og
       `.grab` er festet der med `top: 0`. Uten forskyvningen legger krysset seg
       oppå tittelen i handlen. */
    .sty-close {
      position: sticky; top: var(--grab-h, 44px); z-index: 3;
      display: flex; height: 0; justify-content: flex-end;
    }
    /* `top: 0` er ikke tilfeldig: `.sty-close` er en høyde-0-beholder på
       `.sty`s overkant, altså nøyaktig der overskriftens boks begynner.
       Overskriftens tekstmidte ligger da 4 px (padding) + 11,4 px (halve
       linjeboksen på 19 px × 1,2) = 15,4 px ned — som er halve knappen.
       Midtlinjene møtes, og gjør du noe med skriftstørrelsen over, må dette
       tallet regnes om. */
    .sty-x {
      position: relative; top: 0;
      display: flex; height: 30px; width: 30px; flex: none;
      align-items: center; justify-content: center;
      border-radius: 999px; background: rgba(28,25,23,.05); color: var(--stone-500);
    }
    .sty-x:hover { background: rgba(28,25,23,.1); color: var(--stone-900); }

    /* ---------- Play-kortet (inngangen «Tett») ---------- */
    /* Tettheten møter deg først — den er beviset. Fortellingen er veien inn
       for den som ikke selv begynner å zoome og trykke. */
    .play {
      display: flex; width: 100%; flex: none; align-items: center; gap: 12px;
      margin-bottom: 10px; border-radius: 16px; padding: 11px 12px; text-align: left;
      background: var(--stone-900); color: #fff;
    }
    .play-ic {
      display: flex; height: 34px; width: 34px; flex: none; align-items: center;
      justify-content: center; border-radius: 999px; background: rgba(255,255,255,.14);
    }
    .play-t { min-width: 0; flex: 1; }
    .play-t .n { display: block; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }
    .play-t .s { display: block; font-size: 12px; color: rgba(255,255,255,.6); }
    .play > svg { flex: none; opacity: .5; }

    /* ---------- Hva fortellingen overtar mens den kjører ---------- */
    /* Fortellingen eier flaten: indeksen, FAQ-en og megler-kortet ligger bak
       «Avslutt», ikke under fortellingen. Ellers er den bare en ny header. */
    body[data-story="on"] .sheet-body > .section,
    body[data-story="on"] .sheet-body > .hint,
    body[data-story="on"] .m-empty,
    body[data-story="on"] .scroll > .cat-card,
    body[data-story="on"] .scroll > .section,
    body[data-story="on"] .scroll > .megler { display: none; }

    /* Pinnene er illustrasjon, ikke knapper. I denne modusen er stedene i
       fortellingen trykkflaten — ett interaksjonsmønster, ikke to. */
    /* `!important` fordi Mapbox GL skriver `pointer-events: auto` inline på
       markør-roten, og klikk-lytteren sitter nettopp der. */
    body[data-story="on"] .marker { pointer-events: none !important; }

    /* Tre nivåer, ikke to: de tre navngitte stedene BÆRER scenen, kategorien
       rundt viser at dekningen finnes, og resten av nabolaget ligger igjen som
       tekstur. Med bare dempet/ikke-dempet ble 182 punkter like viktige som de
       tre fortellingen faktisk snakker om. */
    body[data-story="on"] .marker.dim .pin { opacity: .26; }
    body[data-story="on"] .marker.scene .pin { opacity: .6; }
    body[data-story="on"] .marker.named .pin {
      height: 19px; width: 19px; border-width: 3px;
      box-shadow: 0 2px 7px rgba(0,0,0,.32);
    }


    /* ---------- Prototype-verktøyene, samlet bak ÉN knapp ----------
       (AVVIK: ingenting av dette finnes i produksjon.)

       Fire grupper lå utbrettet over kartet: galleri-lenka, board-veksleren
       (NIVÅ 1 · Kuratert/Ukuratert), inngangen (Tett/Fortelling) og utvalget
       (Megler/Nærmest). Tre av dem er stillas, ikke produkt — og så lenge de
       ligger der produktets egne kontroller skal ligge, kan man ikke se på
       flaten og bedømme den. Man ser på verktøykassa.

       De ligger nå bak én knapp i hjørnet. Igjen på kartet står bare
       reisemåte-pillen, som det ekte boardet faktisk har.

       Baselinens `.proto-switch` og `Proto.mountBackLink`s `.proto-back`
       skjules — de er ikke slettet, for de eies av fellesfilene og gjelder
       alle prototypene. Denne iterasjonen overstyrer dem bare for seg selv.
       Veien ut av prototypen ligger nederst i panelet, så regelen om at man
       alltid skal komme seg tilbake til galleriet holder. */
    /* `body`-prefikset er nødvendig, ikke pynt: `Proto.mountBackLink` sprøyter
       sitt eget <style> inn i dokumentet ved kjøring, altså ETTER denne fila.
       Med lik spesifisitet ville den vunnet på kilderekkefølge. */
    body .proto-back, body .proto-switch { display: none; }

    .proto-tools {
      position: fixed; z-index: 60; top: 10px; left: 10px;
      font-size: 11px; font-weight: 600; letter-spacing: .02em;
    }
    @media (min-width: 1024px) {
      .proto-tools { left: calc(var(--sidebar-w) + 10px); }
    }
    .proto-fab {
      display: flex; height: 32px; width: 32px;
      align-items: center; justify-content: center;
      border-radius: 999px; background: rgba(255,255,255,.92);
      box-shadow: 0 1px 6px rgba(0,0,0,.14); color: var(--stone-500);
      transition: color 150ms ease;
    }
    .proto-fab:hover, .proto-fab[aria-expanded="true"] { color: var(--stone-900); }
    .proto-panel {
      position: absolute; top: 100%; left: 0;
      margin-top: 6px; width: 212px; padding: 10px;
      border-radius: 14px; border: 1px solid var(--stone-200);
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 14px 34px rgba(28,25,23,.2);
    }
    .proto-panel[hidden] { display: none; }
    .proto-panel .lbl {
      margin: 10px 2px 5px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .14em; color: var(--stone-400);
    }
    .proto-panel .lbl:first-child { margin-top: 0; }
    .proto-tools .grp {
      display: flex; gap: 2px; padding: 3px; border-radius: 999px;
      background: rgba(0,0,0,.045);
    }
    .proto-tools .grp a {
      min-width: 0; flex: 1; padding: 5px 8px; border-radius: 999px;
      text-align: center; color: var(--stone-500); text-decoration: none;
    }
    .proto-tools .grp a[aria-current="true"] { background: var(--stone-900); color: #fff; }
    .proto-panel .out {
      display: flex; align-items: center; gap: 6px;
      margin-top: 12px; border-top: 1px solid rgba(28,25,23,.07); padding: 9px 2px 0;
      color: var(--stone-500); text-decoration: none;
    }
    .proto-panel .out:hover { color: var(--stone-900); }
    .proto-panel .out svg { height: 13px; width: 13px; }
  </style>
</head>
<body data-story="off">
  <div id="app"></div>
  <!-- Dekket ligger utenfor #app fordi #app bygges på nytt ved hver render,
       og transporten ikke skal blafre. Egen klikk-lytter, se `route`. -->
  <div class="sty-deck" id="deck" hidden></div>
  <nav class="proto-tools" id="tools" aria-label="Prototype-verktøy"></nav>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
  <script src="https://unpkg.com/lucide@0.563.0/dist/umd/lucide.min.js"></script>
  <script src="/_shared/env.js"></script>
  <script src="/_shared/proto.js"></script>
  <script src="/_shared/baseline.js"></script>
  <script>
    const BOARDS = {
      ranheim: "megler-harstad__strindfjordvegen-10-7053-ranheim-norge",
      ferjemannsveien: "klp-eiendom__ferjemannsveien-10",
    };
    const DESKTOP = "(min-width: 1024px)";
    const PLACES_PER_SCENE = 3;   // fortellingens steder: de kameraet rammer inn
    const ROWS_PER_SCENE = 6;     // hele steds-fanen, utvalget + de neste nærmeste
    const SENTENCES_PER_BEAT = 2;
    /* Trykk på et sted gjør to ting: teksten åpner seg og kartet flyr dit. Skjer
       de samtidig, konkurrerer de om samme blikk. Teksten er det fingeren tok
       på, så den går først — kartet følger etter når bevegelsen i sheeten er
       ferdig. Ett blikk om gangen, ikke to. */
    const CAMERA_DELAY_MS = 420;
    const CAMERA_DURATION_MS = 1200;

    const params = new URLSearchParams(location.search);
    const board = params.get("board") || "ranheim";

    // tett       = dagens board først, fortellingen bak en play-knapp
    // fortelling = fortellingen møter deg, boardet ligger bak «Avslutt»
    const ENTRIES = [
      { id: "tett", label: "Tett" },
      { id: "fortelling", label: "Fortelling" },
    ];
    const entry = ENTRIES.some((e) => e.id === params.get("entry")) ? params.get("entry") : "tett";

    // megler = «Verdt å merke seg», altså menneskets utvalg (Moat 1)
    // auto   = de tre nærmeste MÅLTE, altså det maskinen klarer alene
    // Samme board, samme UI — det eneste som endres er hvem som plukket.
    const PICKS = [
      { id: "megler", label: "Megler" },
      { id: "auto", label: "Nærmest" },
    ];
    const pick = PICKS.some((p) => p.id === params.get("pick")) ? params.get("pick") : "megler";

    /* Hver veksler er en LENKE med hele spørrestrengen intakt, ikke en knapp
       som muterer tilstand: å bytte variant skal kunne deles, gjenåpnes og
       stå i historikken — og de andre valgene skal ikke nullstilles på veien. */
    const group = (items, key, active) =>
      `<span class="grp">${items
        .map((it) => {
          const q = new URLSearchParams(location.search);
          q.set(key, it.id);
          return `<a href="?${q}" aria-current="${it.id === active}">${it.label}</a>`;
        })
        .join("")}</span>`;

    /* Verktøyene er samlet bak én knapp. Panelet bygges én gang — det leser
       bare URL-en, og et variantbytte er en full sidelast, så det finnes ingen
       tilstand her som kan bli foreldet. */
    const BOARD_LABELS = { ranheim: "Kuratert", ferjemannsveien: "Ukuratert" };
    const boardItems = Object.keys(BOARDS).map((id) => ({ id, label: BOARD_LABELS[id] ?? id }));
    const tools = document.getElementById("tools");

    function paintTools(open) {
      tools.innerHTML = `
        <button class="proto-fab" data-tools aria-expanded="${open}"
          aria-label="Prototype-verktøy"><i data-lucide="sliders-horizontal"
          style="width:15px;height:15px"></i></button>
        <div class="proto-panel" ${open ? "" : "hidden"}>
          <p class="lbl">Board</p>${group(boardItems, "board", board)}
          <p class="lbl">Inngang</p>${group(ENTRIES, "entry", entry)}
          <p class="lbl">Utvalg</p>${group(PICKS, "pick", pick)}
          <a class="out" href="/"><i data-lucide="arrow-left"
            style="width:13px;height:13px"></i>Alle prototyper</a>
        </div>`;
      if (window.lucide?.createIcons) lucide.createIcons();
    }
    paintTools(false);

    tools.onclick = (ev) => {
      const btn = ev.target.closest("[data-tools]");
      if (btn) paintTools(btn.getAttribute("aria-expanded") !== "true");
    };
    // Trykk utenfor lukker. Samme regel som reisemåte-panelet i sheeten.
    document.addEventListener(
      "pointerdown",
      (ev) => {
        if (!ev.target.closest?.(".proto-tools") && tools.querySelector(".proto-panel:not([hidden])"))
          paintTools(false);
      },
      true
    );

    const { esc, icon, minutesOf, byMinutesThenName, state, rerender, redrawMarkers, showAll } =
      Baseline.util;

    let on = entry === "fortelling";
    let step = 0;         // scene-indeks
    let pane = "tekst";   // "tekst" | "steder" | "faq" — stoppets tre faner
    /* Åpne felt lukkes ALDRI av seg selv. Et sted du har åpnet lukkes bare ved
       at du trykker det igjen — leste du to steder, skal begge kunne stå åpne.
       Auto-lukking var i tillegg halve hoppingen i sheeten: hvert trykk lukket
       ett felt og åpnet et annet, så flaten både krympet og vokste i samme
       bevegelse. Derfor mengder, ikke én id. */
    let openIds = new Set();   // stedene som står utvidet i steds-fanen
    let openFaqs = new Set();  // spørsmålene som står utvidet i svar-fanen
    const clearOpen = () => { openIds = new Set(); openFaqs = new Set(); };
    document.body.dataset.story = on ? "on" : "off";

    const scenes = () => state().board.categories;
    const scene = () => scenes()[step];

    /** Scenens steder: meglerens utvalg. Mangler det, de nærmeste MÅLTE.
     *  Sortert på tid uansett kilde — kurator eier HVILKE tre steder som er
     *  verdt å merke seg, fortellingen eier rekkefølgen de nevnes i. Uten det
     *  leser beatet «17 min, 23 min, 4 min», og ingen guide snakker sånn. */
    function places(cat) {
      const pool = curatedScene(cat)
        ? cat.editorial.highlights
            .map((h) => cat.pois.find((p) => p.id.toLowerCase() === String(h.id).toLowerCase()))
            .filter(Boolean)
        : cat.pois.filter((p) => minutesOf(p) !== undefined);
      return pool.slice().sort(byMinutesThenName).slice(0, PLACES_PER_SCENE);
    }

    /** Radene under utvalget: kategoriens neste nærmeste, de utvalgte trukket
     *  fra. Fanen heter «steder å merke seg», og med bare tre rader leste den
     *  som en rest av prosaen. Med seks er den en liste — og lista peker rett
     *  videre til «Se alle N» i dekket. Kameraet rammer fortsatt bare de tre:
     *  fortellingen snakker om dem, resten er der du kan gå videre selv. */
    function morePlaces(cat) {
      const taken = new Set(places(cat).map((p) => p.id));
      return cat.pois
        .filter((p) => !taken.has(p.id) && minutesOf(p) !== undefined)
        .sort(byMinutesThenName)
        .slice(0, Math.max(0, ROWS_PER_SCENE - PLACES_PER_SCENE));
    }

    /** Kategoriens spørsmål og svar. Finnes de ikke (ukuraterte kategorier har
     *  ingen), forsvinner både fanen og snarveis-kortet — ingen tom flate. */
    const faqsOf = (cat) => cat.editorial?.faq ?? [];

    /** Er scenens utvalg et menneskes? «Nærmest»-veksleren slår det av så
     *  forskjellen kan kjennes på samme board — det er hele skillet mellom en
     *  åpen løsning og en ferdig kuratert. */
    const curatedScene = (cat) =>
      pick === "megler" && (cat.editorial?.highlights ?? []).length > 0;

    /** Fortellingens takt: to setninger, ikke hele strøksteksten. Seks linjer
     *  prosa ganger seks stopp er en nettside igjen, ikke en omvisning — og
     *  det er stedene med målt tid som er beatet, prosaen bare rammer dem inn.
     *  Kuttet skjer på setningsslutt, aldri midt i et ord: ingen ellipse.
     *  Den fulle teksten finnes fortsatt i drill-in etter «Avslutt».
     *  (Forkortelser med punktum ville kuttet tidlig — ingen i disse dataene.) */
    function beat(text) {
      const full = String(text ?? "").trim();
      const sentences = full.match(/[^.!?]+[.!?]+(\s|$)/g);
      if (!sentences || sentences.length <= SENTENCES_PER_BEAT) return full;
      return sentences.slice(0, SENTENCES_PER_BEAT).join("").trim();
    }

    /** Stedets egne ord. Ingen tekst = ingen chevron; raden lover ikke noe tom. */
    const narrativeOf = (p) =>
      p.raw?.grounding?.curated?.narrative ??
      p.raw?.grounding?.generated?.narrative ??
      p.raw?.editorialHook ??
      "";

    /** Ikon og farge til stedets brikke. Kuratoren har gitt hvert utvalgt sted
     *  sitt eget ikon; er stedet plukket av maskinen, arver det kategoriens. */
    function chipOf(p, cat) {
      const h = (cat.editorial?.highlights ?? []).find(
        (x) => String(x.id).toLowerCase() === p.id.toLowerCase()
      );
      return { icon: h?.icon ?? cat.icon, color: h?.color ?? cat.color };
    }

    // Navngitte punkter cachet per scene: `marker` kalles én gang per POI per
    // opptegning (464 på Ranheim), og et oppslag der skal ikke koste et søk.
    let spotFor = -1;
    let spot = new Set();
    function spotIds() {
      if (spotFor !== step) {
        spot = new Set(places(scene()).map((p) => p.id));
        spotFor = step;
      }
      return spot;
    }

    // ---------- render ----------
    function placeRow(p, cat) {
      const m = minutesOf(p);
      const narr = narrativeOf(p);
      const open = openIds.has(p.id);
      // `aria-current` merker stedet som vises på kartet, `aria-expanded` bare
      // de radene som faktisk HAR noe å utvide. Chevron-plassen holdes åpen
      // uansett — ellers rykker høyrekanten på et sted uten tekst.
      return `<li>
        <button class="sty-row" data-story-poi="${esc(p.id)}" aria-current="${open}"
          ${narr ? `aria-expanded="${open}"` : ""}>
          <span class="dot" style="background:${esc(cat.color)}"></span>
          <span class="n">${esc(p.name)}</span>
          ${m !== undefined ? `<span class="m">${m} min</span>` : ""}
          ${narr ? `<span class="chev">${icon("chevron-down", 15)}</span>` : `<span class="chev-gap"></span>`}
        </button>
        ${narr ? `<div class="sty-narr" data-expanded="${open}"><p>${esc(narr)}</p></div>` : ""}
      </li>`;
    }

    const paneTitle = (cat) => (curatedScene(cat) ? "Verdt å merke seg" : "Nærmest hjemmefra");

    /** Fane 1: svaret i ord, med de to andre fanene som kort under. Kortene er
     *  halve hver fordi de er likeverdige innganger: stedene og spørsmålene er
     *  to former av samme svar, ikke ett svar og en fotnote. */
    function proseTab(cat, ps) {
      const faqs = faqsOf(cat);
      return `${cat.lead ? `<p class="sty-lead">${esc(beat(cat.lead))}</p>` : ""}
        <div class="sty-dual${faqs.length ? "" : " one"}">
          <button class="sty-mini" data-pane="steder">
            <span class="hl-icons">${ps
              .map((p) => {
                const c = chipOf(p, cat);
                return `<span><span class="hl-icon" style="background:${esc(c.color)}">${icon(c.icon, 14)}</span></span>`;
              })
              .join("")}</span>
            <span class="t">${ps.length} ${ps.length === 1 ? "sted" : "steder"} å merke seg</span>
            <span class="b"><span class="s">Se hvilke</span>${icon("arrow-right", 14)}</span>
          </button>
          ${
            faqs.length
              ? `<button class="sty-mini" data-pane="faq">
                   <span class="hl-icons"><span><span class="hl-icon"
                     style="background:${esc(cat.color)}">${icon("message-circle-question", 14)}</span></span></span>
                   <span class="t">Spørsmål og svar</span>
                   <span class="b"><span class="s">${faqs.length} svar</span>${icon("arrow-right", 14)}</span>
                 </button>`
              : ""
          }
        </div>`;
    }

    /** Fane 2: samme svar, som steder. Første eyebrow sier hvem som plukket de
     *  tre — det er skillet mellom en åpen og en ferdig kuratert versjon. Under
     *  dem står kategoriens neste nærmeste, så fanen er en liste og ikke tre
     *  løse rader. */
    function placesTab(cat, ps) {
      const more = morePlaces(cat);
      return `<div class="sty-ebrow sty-eb">
          <p class="eyebrow">${paneTitle(cat)}</p>
          ${modeCell()}
        </div>
        <ul class="sty-list">${ps.map((p) => placeRow(p, cat)).join("")}</ul>
        ${
          more.length
            ? `<p class="eyebrow sty-more">Flere i nærheten</p>
               <ul class="sty-list">${more.map((p) => placeRow(p, cat)).join("")}</ul>`
            : ""
        }`;
    }

    /** Stedsnavn i et FAQ-svar står som `[Extra Grilstad](poi:google-…)`.
     *  Produksjonens `linkedText` gjør dem til knapper som åpner POI-modalen,
     *  og modusen har ingen modal — så her beholdes navnet og referansen faller
     *  bort. Uten dette leser svaret som rå markup. */
    const plainText = (answer) =>
      String(answer ?? "").replace(/\[([^\]]+)\]\((?:poi|category):[^)]+\)/g, "$1");

    /** Fane 3: kategoriens spørsmål og svar. */
    function faqTab(cat) {
      const faqs = faqsOf(cat);
      if (!faqs.length) return "";
      return `<div class="sty-faq">
        <div class="faq-list">${faqs
          .map((e) => {
            const open = openFaqs.has(e.id);
            return `<div class="faq-item">
              <button class="faq-q" aria-expanded="${open}" data-story-faq="${esc(e.id)}">
                <span class="t">${esc(e.question)}</span>
                <span class="chev">${icon("chevron-down", 16)}</span>
              </button>
              <div class="faq-a" data-expanded="${open}"><p>${esc(plainText(e.answer))}</p></div>
            </div>`;
          })
          .join("")}</div>
      </div>`;
    }

    /* Spørsmålet står OVER fanene, ikke inni en av dem: stoppet ER spørsmålet,
       og fanene er tre svar på det — ord, steder, spørsmål. Det er grunnen til at
       faner slår et rom med tilbake-pil her; med spørsmålet inne i fane 1 ville
       fane 2 føltes som å navigere bort fra stoppet. Fordi ingen tilbake-pil
       trengs, kan «forrige stopp» ligge i dekket og gjelde begge faner. */
    function storyCard() {
      const all = scenes();
      const cat = all[step];
      const ps = places(cat);
      const faqs = faqsOf(cat);
      const rows = ps.length + morePlaces(cat).length;
      const tab = (id, label) =>
        `<button role="tab" aria-selected="${pane === id}" data-pane="${id}">${label}</button>`;

      return `<section class="sty" data-story-card>
        <div class="sty-close">
          <button class="sty-x" data-story-exit aria-label="Avslutt omvisningen">${icon("x", 15)}</button>
        </div>
        <h3 class="sty-q">${esc(cat.question || cat.label)}</h3>

        <div class="sty-tabs" role="tablist">
          ${tab("tekst", "Om området")}${tab("steder", `Steder (${rows})`)}${
            faqs.length ? tab("faq", `Spørsmål (${faqs.length})`) : ""
          }
        </div>

        <div class="sty-tab">
          <div class="sty-pane" role="tabpanel" data-active="${pane === "tekst"}"
            ${pane === "tekst" ? "" : 'aria-hidden="true"'}>${proseTab(cat, ps)}</div>
          <div class="sty-pane" role="tabpanel" data-active="${pane === "steder"}"
            ${pane === "steder" ? "" : 'aria-hidden="true"'}>${placesTab(cat, ps)}</div>
          ${
            faqs.length
              ? `<div class="sty-pane" role="tabpanel" data-active="${pane === "faq"}"
                   ${pane === "faq" ? "" : 'aria-hidden="true"'}>${faqTab(cat)}</div>`
              : ""
          }
        </div>
      </section>`;
    }

    /** Dekket har én ting igjen: veien videre. Telleren og utgangen ligger i
     *  stripen øverst i sheeten, og «forrige» er å trykke et segment du alt
     *  har vært på — den knappen fantes bare fordi ingenting annet gikk
     *  bakover.
     *
     *  Neste stopp navngis med KATEGORIEN, ikke spørsmålet: spørsmålene står som
     *  overskrift inne i stoppet, og to setninger som lovet det samme på to
     *  måter var mer å lese, ikke mer å forstå. */
    /* ---------- reisemåte ----------
     *  Modusene defineres her fordi baselinens egen `MODES` bor inne i IIFE-en.
     *  Rekkefølgen, etikettene og ikonene må matche kart-pillen — er de ulike,
     *  leser de to inngangene som to funksjoner. Samme grunn til at produksjonen
     *  deler `TravelModeSelector` mellom chipen og kart-kontrollen. */
    const MODES = [
      { id: "walk", label: "Gange", icon: "footprints" },
      { id: "bike", label: "Sykkel", icon: "bike" },
      { id: "car", label: "Bil", icon: "car" },
    ];
    /** Bare modusene boardet faktisk har tall for — samme regel som baselinen.
     *  Ett valg er ikke et valg: da rendres rommet ikke i det hele tatt, og
     *  baren ser ut som før reisemåte fantes. */
    function modes() {
      const b = state().board;
      return MODES.filter((m) =>
        b.categories.some((c) => c.pois.some((p) => p.raw?.travelTime?.[m.id] != null))
      );
    }
    /** Stedet panelets tider hører til. Et stopp har tre steder, ikke ett, så
     *  det finnes ikke ett A→B før du har åpnet et av dem.
     *
     *  Slås opp i stoppets egen liste, IKKE i `board.poisById`: de to holder
     *  ulike former av samme sted. Lista har den adapterte POI-en (tidene
     *  ligger under `raw.travelTime`, som `minutesOf` leser), mens `poisById`
     *  holder den rå (tidene ligger på `travelTime` direkte). Leser man feil
     *  av dem, blir hver eneste tid «–» selv om raden rett over viser 3 min. */
    function openPoi() {
      const s = state();
      if (!s.activePoiId) return null;
      return scene()?.pois.find((p) => p.id === s.activePoiId) ?? null;
    }
    let modeOpen = false;

    /** Enheten over minutt-kolonnen: aktiv modus kollapset, alle tre utvidet.
     *  To innganger til samme tilstand er med vilje — produksjonen har det
     *  samme (kart-kontrollen og chipen på ruta deler `TravelModeSelector`).
     *  Den ene styrer kartet, den andre merker lista. */
    function modeCell() {
      const all = modes();
      if (all.length < 2) return "";
      const active = all.find((m) => m.id === state().travelMode) ?? all[0];
      // Tidene i panelet hører til det åpne stedet. Uten et åpent sted vises
      // bare navnene: «–» tre ganger ville lest som «ingen rute finnes», ikke
      // som «du har ikke valgt et sted ennå».
      const poi = openPoi();
      const rows = all
        .map((m) => {
          const v = poi?.raw?.travelTime?.[m.id];
          const min = typeof v === "number" && Number.isFinite(v) ? `${v} min` : "–";
          return `<button data-mode="${m.id}" aria-pressed="${m.id === active.id}">
            <span class="ic">${icon(m.icon, 15)}</span>
            <span class="nm">${esc(m.label)}</span>
            ${poi ? `<span class="mn">${min}</span>` : ""}
          </button>`;
        })
        .join("");
      return `<div class="sty-mode" data-mode-menu>
        <button data-mode-toggle aria-expanded="${modeOpen}" aria-label="Reisemåte">
          <span class="ic">${icon(active.icon, 13)}</span>
          <span>${esc(active.label)}</span>
          <span class="chev">${icon("chevron-down", 13)}</span>
        </button>
        <div class="sty-modepop" ${modeOpen ? "" : "hidden"}>
          ${rows}
          <p class="foot">${poi ? `Til ${esc(poi.name)}` : "Gjelder alle tider i lista"}</p>
        </div>
      </div>`;
    }

    /** Bytter panelet mellom åpen og lukket UTEN å rendre hele flaten: en
     *  render ville rullet Steder-fanen tilbake dit baselinen mener den skal
     *  stå, og det er en bevegelse du ikke ba om når du bare åpnet en meny. */
    function paintMode() {
      const cells = document.querySelectorAll("[data-mode-menu]");
      if (!cells.length) return;
      // Alle forekomstene, ikke den første: `storyCard` mates til både sheeten
      // og sidekolonnen, og ved desktop-bredde finnes kontrollen to steder.
      for (const cell of cells) cell.outerHTML = modeCell();
      if (window.lucide?.createIcons) lucide.createIcons();
    }

    function storyDeck() {
      const all = scenes();

      return `<div class="sty-hop">
        <div class="sty-hoptrack" data-story-hoptrack>
          <div class="sty-hoprail" data-story-hop>${all
            .map(
              (c, n) =>
                `<button data-story-goto="${n}" data-state="${n < step ? "past" : ""}"
                   aria-current="${n === step}" style="--c:${esc(c.color)}"
                   ><span class="ic">${icon(c.icon, 12)}</span><span>${esc(c.label)}</span></button>`
            )
            .join("")}</div>
        </div>
      </div>`;
    }

    /** Tegner dekket og publiserer høyden det faktisk fikk. Rekkefølgen mot
     *  `sizeStory` er poenget: sheeten padder for dekket, så måles den. */
    function paintDeck() {
      const deck = document.getElementById("deck");
      if (!deck) return 0;
      const rail = deck.querySelector("[data-story-hop]");
      if (on && rail) {
        // Bygges IKKE på nytt: da ville din egen scroll-posisjon i raden blitt
        // nullstilt hver gang kartet la seg til ro. Bare tilstanden byttes.
        for (const b of rail.children) {
          const n = Number(b.dataset.storyGoto);
          b.setAttribute("aria-current", String(n === step));
          b.dataset.state = n < step ? "past" : "";
        }
      } else {
        deck.hidden = !on;
        deck.innerHTML = on ? storyDeck() : "";
        if (on && window.lucide?.createIcons) lucide.createIcons();
      }
      const h = on ? deck.offsetHeight : 0;
      document.documentElement.style.setProperty("--sty-deck-h", `${h}px`);
      // Dekket ligger OVER sheeten. Slår brukeren flaten sammen for å se
      // kartet, må handlen legge seg over dekket og ikke bak det.
      state().sheetFloorInset = h;
      return h;
    }

    function playCard() {
      const n = scenes().length;
      return `<button class="play" data-story-play>
        <span class="play-ic">${icon("play", 18)}</span>
        <span class="play-t">
          <span class="n">La nabolaget presentere seg</span>
          <span class="s">${n} stopp · ${pick === "megler" ? "meglerens utvalg" : "nærmeste steder"}</span>
        </span>
        ${icon("chevron-right", 18)}
      </button>`;
    }

    // ---------- kamera ----------
    /** Rammen legges rundt boligen + scenens tre steder, ikke rundt alle 182.
     *  Da er de navngitte punktene lesbare, mens kategoriens øvrige punkter
     *  ligger rundt som dempet tekstur: dekningen synes, uten å ta ordet. */
    function fitScene() {
      const s = state();
      const b = new mapboxgl.LngLatBounds();
      // I steds-fanen strammes rammen til stedene alene. Kartet bekrefter fane-
      // skiftet samtidig som brikken flytter seg. I ord-fanene (prosa og svar)
      // står boligen med: teksten handler om området sett fra døra.
      if (pane !== "steder") b.extend([s.board.home.coordinates.lng, s.board.home.coordinates.lat]);
      for (const p of places(scene())) b.extend([p.coordinates.lng, p.coordinates.lat]);

      // Sheeten dekker underkanten — uten padding for den legger fortellingen
      // seg oppå stedene den snakker om. Høyden LESES, for brukeren kan ha
      // dratt sheeten hvor som helst mellom sammenslått og taket.
      const sheetH = Baseline.util.sheetVisibleH() || innerHeight * 0.45;
      const bottom = Math.min(Math.round(sheetH) + 24, Math.round(innerHeight * 0.62));

      s.map.fitBounds(b, {
        padding: matchMedia(DESKTOP).matches
          ? { top: 80, right: 80, bottom: 80, left: 80 }
          : { top: 90, right: 48, bottom, left: 48 },
        maxZoom: 15.4,
        duration: 1100,
      });
    }

    /** Sheeten har ÉN høyde gjennom hele omvisningen.
     *
     *  Den vokste før: åpnet du et sted, la sheeten seg etter teksten. Det ser
     *  omtenksomt ut og er det motsatte — flaten du leser i, kartutsnittet over
     *  den og avstanden ned til dekket endret seg av et trykk som bare skulle
     *  åpne en setning. Følgen var større enn handlingen, og den kunne du ikke
     *  styre. Nå er sheeten et vindu: innholdet scroller inni, vinduet står.
     *
     *  Høyden måles én gang, på første stopp med ord-fanen åpen — altså det
     *  guiden faktisk serverer først. Da fyller den vanlige visningen sheeten
     *  uten scroll, mens steds- og svar-fanen får noe å scrolle i. Grensene er
     *  baselinens: REST_HIGH_FRACTION-taket og REST_LOW_MIN_PX-gulvet.
     *
     *  Målt høyde blir sheetens HVILESTILLING, ikke en låst høyde. Vinduet står
     *  fortsatt av seg selv — et trykk som åpner en setning flytter det ikke —
     *  men brukeren kan dra sheeten opp til taket når hen selv vil. Det er
     *  forskjellen som betyr noe: en følge du ikke ba om, mot en du styrer. */
    let tourH = null;
    function sizeStory() {
      if (!on || matchMedia(DESKTOP).matches) return undefined;
      const sheet = document.querySelector("[data-sheet]");
      const card = sheet?.querySelector("[data-story-card]");
      if (!sheet || !card) return undefined;
      const frameH = document.querySelector(".frame")?.clientHeight ?? innerHeight;
      // Kroppen selv, ikke kort + påslag: kortets margin og innholdets padding
      // for dekket ligger alt inne i det tallet. Kroppen vokser ikke med
      // sheetens gulv (den er ikke `flex: 1`), så gulvet fra forrige stopp
      // forurenser ikke målingen — men dekket må være malt først.
      if (tourH === null) {
        const grab = sheet.querySelector(".grab")?.offsetHeight ?? 44;
        tourH = grab + (sheet.querySelector(".sheet-body")?.offsetHeight ?? card.offsetHeight);
      }
      const h = Math.max(Math.min(tourH, Math.round(frameH * 0.86)), 236);
      state().sheetRestH = h;
      Baseline.util.sizeSheet();
      return h;
    }

    /** Måler og setter sheeten etter layout, og rammer så inn kameraet med den
     *  høyden sheeten faktisk fikk. Rekkefølgen er poenget: rammer vi inn
     *  først, padder vi for en høyde sheeten ikke har ennå, og stedene
     *  fortellingen snakker om havner bak den. */
    /** Legger det aktive stoppet mot venstre kant, men ikke helt inntil: 40 px
     *  igjen til det forrige navnet, så raden viser at den har en bakside.
     *  Klemt mellom 0 og radens egen slutt — ellers ville siste stopp dratt
     *  tomrom inn i sporet. */
    function positionHop() {
      const track = document.querySelector("[data-story-hoptrack]");
      const btn = track?.querySelector('[aria-current="true"]');
      if (!track || !btn) return;
      const max = Math.max(0, track.scrollWidth - track.clientWidth);
      track.scrollLeft = Math.min(Math.max(0, btn.offsetLeft - 44), max);
    }

    function settle({ fit = false } = {}) {
      // To frames, ikke én: i frame 1 er det nyrendrede kortet ennå ikke ferdig
      // lagt ut, og førstegangs-målingen kom 4 px for lav. Frame 2 leser en
      // ferdig layout, og 16 ms er usynlig mot høyde-animasjonens 420.
      requestAnimationFrame(() =>
        requestAnimationFrame(() => {
          paintDeck();
          sizeStory();
          positionHop();
          // Ikke hvilestillingen, men den høyden sheeten faktisk STÅR i: har
          // brukeren slått den sammen for å se kartet, skal kameraet bruke
          // plassen hen ga det.
          if (fit) fitScene();
        })
      );
    }

    // ---------- handlinger ----------
    /* Kamerabevegelsen som venter på teksten. Trykker du et nytt sted før den
       har fyrt, skal den forrige aldri komme etterpå — da flyr kartet til et
       sted du alt har forlatt. */
    let pendingFly = 0;
    function flyAfterText(poi) {
      clearTimeout(pendingFly);
      if (!poi) return;
      const s = state();
      pendingFly = setTimeout(() => {
        s.map.flyTo({
          center: [poi.coordinates.lng, poi.coordinates.lat],
          zoom: Math.max(s.map.getZoom(), 15.6),
          duration: CAMERA_DURATION_MS,
        });
      }, CAMERA_DELAY_MS);
    }

    function begin() {
      on = true;
      step = 0;
      pane = "tekst";
      clearOpen();
      spotFor = -1;
      document.body.dataset.story = "on";
      const s = state();
      s.activeCategoryId = null;
      s.activePoiId = null;
      s.modalPoiId = null;
      s.sheetRestH = null; // fortellingen hviler et annet sted enn kortlista
      s.sheetAtRest = true; // omvisningen begynner i sin egen hvilestilling
      tourH = null; // måles på nytt for denne omvisningen, så én gang
      rerender();
      redrawMarkers();
      settle({ fit: true });
    }

    function goto(n) {
      step = Math.max(0, Math.min(scenes().length - 1, n));
      pane = "tekst"; // nytt stopp begynner alltid med spørsmålet
      clearOpen(); // ny scene, nytt utvalg — ikke en lukking brukeren merker
      clearTimeout(pendingFly);
      state().activePoiId = null;
      rerender();
      redrawMarkers();
      settle({ fit: true });
    }

    /** Bytt fane innenfor stoppet. Kameraet følger etter, så skiftet kjennes. */
    function showPane(next) {
      if (next === pane) return; // trykk på aktiv fane skal ikke flytte kartet
      pane = next;
      // Åpne felt blir stående: bytter du fane og tilbake, står stedet du leste
      // fortsatt åpent. Det er brukeren som lukker, ikke navigasjonen.
      clearTimeout(pendingFly); // fanebyttet overtar kameraet
      rerender();
      redrawMarkers();
      settle({ fit: true });
    }

    function end() {
      on = false;
      pane = "tekst";
      clearOpen();
      clearTimeout(pendingFly);
      document.body.dataset.story = "off";
      const s = state();
      s.modalPoiId = null;
      s.sheetRestH = null; // tilbake til baselinens hvilestilling
      s.sheetAtRest = true;
      paintDeck();
      showAll(); // nullstiller kategori + POI, tegner markører, rendrer
      // Kameraet ut igjen: hele nabolaget, som når boardet åpnes. Nå er
      // tettheten det du utforsker, ikke det første du må tolke.
      s.map.flyTo({
        center: [s.board.home.coordinates.lng, s.board.home.coordinates.lat],
        zoom: 14.4,
        duration: 900,
      });
    }

    /** Åpner eller lukker ett felt, i DOM-en vi alt har.
     *
     *  Ingen render: `rerender()` bygger `#app` på nytt, og da mister sheeten
     *  scroll-posisjonen sin. DET var hoppet — verst ved lukking, fordi du
     *  gjerne har scrollet et stykke ned før du lukker igjen.
     *
     *  Høyden settes til feltets EGEN høyde, ikke CSS-taket (600/1200 px).
     *  Lukker du fra taket, står feltet stille mens taket faller ned til
     *  innholdet, og bevegelsen begynner for sent. */
    function setDisclosure(el, open) {
      if (!el) return;
      el.style.maxHeight = `${el.scrollHeight}px`; // der feltet faktisk står nå
      el.dataset.expanded = String(open);
      if (open) return;
      void el.offsetHeight; // tving fram utgangspunktet før vi ber om null
      el.style.maxHeight = "0px";
    }

    /** Trykk på et sted: teksten åpner seg i raden, og kartet flyr dit ETTERPÅ.
     *  Aldri en modal — det er den kompleksiteten modusen fjerner. Andre trykk
     *  lukker DET stedet; andre åpne steder står som de står. */
    function tapPlace(btn) {
      const id = btn.dataset.storyPoi;
      const opening = !openIds.has(id);
      if (opening) openIds.add(id);
      else openIds.delete(id);
      btn.setAttribute("aria-current", String(opening));
      if (btn.hasAttribute("aria-expanded")) btn.setAttribute("aria-expanded", String(opening));
      setDisclosure(btn.parentElement.querySelector(".sty-narr"), opening);
      // Kartet følger bare det du åpner. Lukker du et felt, blir kameraet
      // stående — å fly tilbake på en lukking er en bevegelse du ikke ba om.
      const s = state();
      if (opening) {
        s.activePoiId = id;
        flyAfterText(s.board.poisById[String(id).toLowerCase()]);
      } else if (s.activePoiId === id) {
        s.activePoiId = null;
        clearTimeout(pendingFly);
      }
      redrawMarkers(); // labelen på kartet, ikke sheeten
    }

    /** Trykk på et spørsmål. Svaret er tekst om området, ikke ett sted, så
     *  kartet rører seg ikke — bare feltet i lista åpner seg. */
    function tapFaq(btn) {
      const id = btn.dataset.storyFaq;
      const opening = !openFaqs.has(id);
      if (opening) openFaqs.add(id);
      else openFaqs.delete(id);
      btn.setAttribute("aria-expanded", String(opening));
      setDisclosure(btn.parentElement.querySelector(".faq-a"), opening);
    }

    // ---------- klikk ----------
    /** Én ruting for begge flatene: baselinens `onClick` dekker sheeten og
     *  sidekolonnen, dekkets egen lytter dekker det som ligger utenfor #app. */
    function route(t) {
      if (t.closest("[data-story-play]")) return begin(), true;
      if (t.closest("[data-story-exit]")) return end(), true;
      // Reisemåte-rommet. `[data-mode]` er scopet til panelet: baselinen har
      // sin egen lytter på samme attributt for kart-pillen, og en uscopet
      // treff her ville stjålet det trykket utenfor omvisningen.
      if (t.closest("[data-mode-toggle]")) {
        modeOpen = !modeOpen;
        paintMode();
        return true;
      }
      const pick = t.closest("[data-mode-menu] [data-mode]");
      if (pick) {
        // Modusbytte rører ALDRI navigasjonen — bare tallene. Du står i samme
        // stopp, med de samme stedene åpne, og ser tidene endre seg.
        state().travelMode = pick.dataset.mode;
        modeOpen = false;
        rerender();
        settle();
        return true;
      }
      const jump = t.closest("[data-story-goto]");
      if (jump) {
        // Panelet skal aldri overleve inn i et annet stopp enn det ble åpnet i.
        modeOpen = false;
        return goto(Number(jump.dataset.storyGoto)), true;
      }
      const tab = t.closest("[data-pane]");
      if (tab) return showPane(tab.dataset.pane), true;
      const row = t.closest("[data-story-poi]");
      if (row) return tapPlace(row), true;
      const q = t.closest("[data-story-faq]");
      if (q) return tapFaq(q), true;
      return false;
    }

    document.getElementById("deck").onclick = (ev) => route(ev.target);

    // Trykk utenfor lukker panelet uten å bytte modus — samme regel som chipen
    // på ruta i produksjon. Capture, så det skjer før flaten under rekker å
    // reagere på trykket.
    document.addEventListener(
      "pointerdown",
      (ev) => {
        if (!modeOpen || ev.target.closest?.("[data-mode-menu]")) return;
        modeOpen = false;
        paintMode();
      },
      true
    );

    // ---------- overstyringer ----------
    Baseline.override({
      sheetTop: () => (on ? storyCard() : playCard()),
      sidebarTop: () => (on ? storyCard() : playCard()),
      // Indeksen finnes fortsatt — den ligger bak «Avslutt».
      mobileCard: (c, list) => (on ? "" : Baseline.baseMobileCard(c, list)),
      desktopCard: (c) => (on ? "" : Baseline.baseDesktopCard(c)),
      // Ingen tittel i presentasjonsmodus: «Bli kjent med nabolaget» sa ingenting
      // stoppet ikke alt sier bedre, og tok en linje over spørsmålet.
      sheetTitle: () => (on ? "" : "I nærheten"),

      /** Scenens kategori står frem, resten dempes, og BARE de navngitte
       *  stedene får navn på kartet. Uten dette ville 182 labels tent
       *  samtidig så snart zoom-nivået krysset label-terskelen. */
      marker(poi, cat) {
        if (!on) return null;
        const named = spotIds().has(poi.id);
        const inScene = cat.id === scene().id;
        return {
          dim: !named && !inScene,
          // Navn bare på det du faktisk har trykket. De tre stedene ligger tre
          // minutter fra hverandre — tre labels samtidig ble uleselig grøt, og
          // navnene står allerede i fortellingen.
          label: poi.id === state().activePoiId,
          className: named ? "named" : inScene ? "scene" : "",
        };
      },

      onClick: (t) => route(t),
    });

    Baseline.start(BOARDS[board] ?? BOARDS.ranheim, { boards: BOARDS, active: board }).then(() => {
      const map = state().map;
      // Første scene kan ikke rammes inn før kartet har lastet stilen.
      const opened = () => {
        if (on) redrawMarkers();
        settle({ fit: on });
      };
      if (map.loaded()) opened();
      else map.once("load", opened);
      // Sheeten måles på nytt når rammen endrer seg — baselinen rendrer på
      // resize, men den kjenner ikke fortellingens høyde.
      addEventListener("resize", () => settle());
    });
  </script>
</body>
</html>
