<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Sundsøya — FINN Nærområdet vs. Placy</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; background: #111; color: #fff; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; }
  .panel { position: relative; }
  .panel img { width: 100%; display: block; border-radius: 6px; }
  .label { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.78); padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .label small { display: block; font-weight: 400; opacity: .85; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <img src="finn-naeromraadet.png" alt="FINN Nærområdet">
    <div class="label">FINN Nabolagsprofil — «Nærområdet»<small>3 pins. Dagligvare «17 min gange». Skole oppgitt i kjøretid.</small></div>
  </div>
  <div class="panel">
    <img src="board-desktop.png" alt="Placy rapport-board">
    <div class="label">Placy — samme adresse<small>64 navngitte steder + kuratert lokalkunnskap per tema.</small></div>
  </div>
</div>
</body>
</html>
